[package]
name = "kipio_dafny_runtime"
version = "0.1.0"
edition = "2024"
description = "Runtime support for Kipio's Dafny-generated Rust code"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AndresChanchi/sovereign-account"
documentation = "https://docs.rs/kipio_dafny_runtime"
readme = "README.md"
keywords = ["dafny", "runtime", "formal-verification", "wasm"]
categories = ["development-tools", "wasm"]

[dependencies]
once_cell = "1.21.3"
num = "0.4.3"
itertools = "0.14.0"

[features]
# Use `dafny translate rs --rust-sync --include-runtime file.dfy`
# to compile to code where values can be sent safely through threads
# This will include the runtime with the sync feature

# Use --features small-int to make DafnyInt use i128 instead of num::BigInt
sync = []
small-int = []
